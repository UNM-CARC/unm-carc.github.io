name: Documentation

on:
  push:
    branches:
      - main
  # Run validation and a full trial build on PRs, so a broken page or a missing
  # legacy redirect fails BEFORE it reaches main rather than after.
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan (dry run) or sync'
        type: choice
        options: [plan, sync]
        default: plan

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Validate that every docs page conforms to the Open Knowledge Format (OKF v0.2)
  okf-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install pyyaml
      - run: python scripts/okf_validate.py docs
      # No page may hotlink a binary from the old Cascade host, and every local
      # /assets/ reference must resolve. Hermetic — no network.
      - run: python scripts/check_legacy_links.py docs

  build:
    needs: okf-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install pyyaml markdown
      # Regenerate the llms.txt machine-readable indexes at build time, so
      # content edited straight in the GitHub web UI ships fresh indexes
      # without anyone running scripts locally
      - run: python scripts/gen_llms_txt.py
      # UNM Cascade standard rendering for every page + Googie homepage
      - run: python scripts/build_cascade_site.py
      # Agent surface: markdown mirror, OKF meta injection, robots.txt
      - run: python scripts/postbuild_agent_surface.py site
      # Apache 301s for superseded legacy Cascade URLs, plus ErrorDocument 404.
      # Only meaningful on the UNM host; harmless in the Pages artifact.
      - run: python scripts/gen_htaccess.py site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
          # Without this the action silently drops dotfiles, which would strip
          # .htaccess — and with it every redirect — from the UNM deploy while
          # every local check still passed.
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Staging mirror at unm-carc.github.io — free, and lets a build be inspected
  # before it reaches the public host.
  deploy-pages:
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/deploy-pages@v5
        id: deployment

  # Publish into Cascade CMS, which then publishes to carc.unm.edu by SFTP.
  #
  # GitHub's runners cannot reach the web server directly (port 22 on
  # cpanel01.unm.edu is firewalled from off-campus), but Cascade's REST API is
  # public, so the built site is pushed into Cascade's asset tree and Cascade
  # does the SFTP. See scripts/cascade_sync.py for the ownership rules.
  #
  # Manual-only (workflow_dispatch) until the cutover is complete, then gated
  # on the CASCADE_SYNC_ENABLED repository variable. The environment holds
  # CASCADE_API_KEY — a dedicated service user's key, never a personal one —
  # and should require a reviewer until the pipeline is boring.
  publish-cascade:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CASCADE_SYNC_ENABLED == 'true')
    environment: unm-production
    runs-on: ubuntu-latest
    # Not the shared `pages` group: cancelling mid-sync would leave a
    # half-published tree in Cascade.
    concurrency:
      group: publish-cascade
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Check the Cascade key is configured
        id: check
        env:
          KEY: ${{ secrets.CASCADE_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CASCADE_API_KEY not set; skipping publish to carc.unm.edu"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync the built site into Cascade
        if: steps.check.outputs.configured == 'true'
        env:
          CASCADE_API_KEY: ${{ secrets.CASCADE_API_KEY }}
          MODE: ${{ inputs.mode || 'sync' }}
        run: |
          set -euo pipefail
          # `plan` is a dry run; `sync` creates/edits, publishes changed
          # assets individually, and verifies every one live by SHA-256.
          python scripts/cascade_sync.py "$MODE" --site site --publish changed --verify-live

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.configured == 'true'
        with:
          name: cascade-sync-journal
          path: .cascade-sync/
          if-no-files-found: ignore
          retention-days: 30
