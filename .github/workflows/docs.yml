name: Documentation

on:
  push:
    branches:
      - main
  # Run validation and a full trial build on PRs, so a broken page or a missing
  # legacy redirect fails BEFORE it reaches main rather than after.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Validate that every docs page conforms to the Open Knowledge Format (OKF v0.2)
  okf-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install pyyaml
      - run: python scripts/okf_validate.py docs
      # No page may hotlink a binary from the old Cascade host, and every local
      # /assets/ reference must resolve. Hermetic — no network.
      - run: python scripts/check_legacy_links.py docs

  build:
    needs: okf-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install pyyaml markdown
      # Regenerate the llms.txt machine-readable indexes at build time, so
      # content edited straight in the GitHub web UI ships fresh indexes
      # without anyone running scripts locally
      - run: python scripts/gen_llms_txt.py
      # UNM Cascade standard rendering for every page + Googie homepage
      - run: python scripts/build_cascade_site.py
      # Agent surface: markdown mirror, OKF meta injection, robots.txt
      - run: python scripts/postbuild_agent_surface.py site
      # Apache 301s for superseded legacy Cascade URLs, plus ErrorDocument 404.
      # Only meaningful on the UNM host; harmless in the Pages artifact.
      - run: python scripts/gen_htaccess.py site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
          # Without this the action silently drops dotfiles, which would strip
          # .htaccess — and with it every redirect — from the UNM deploy while
          # every local check still passed.
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Staging mirror at unm-carc.github.io — free, and lets a build be inspected
  # before it reaches the public host.
  deploy-pages:
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/deploy-pages@v5
        id: deployment

  # Publish to UNM's Apache document root for carc.unm.edu.
  #
  # Inert until the repository has CARC_DEPLOY_KEY / CARC_DEPLOY_HOST /
  # CARC_DEPLOY_USER / CARC_DOCROOT secrets, so it is safe to merge before the
  # hosting details are settled.
  #
  # NOTE: intentionally no --delete. The document root may be shared with other
  # UNM sites, and the migration deliberately leaves legacy Cascade files in
  # place so old URLs keep serving. Do not add --delete until the docroot is
  # confirmed to belong to CARC alone, and then only after a --dry-run.
  publish-unm:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: unm-production
    runs-on: ubuntu-latest
    # Deliberately NOT the shared `pages` concurrency group: cancelling this
    # job mid-rsync would leave the live document root half-written.
    concurrency:
      group: publish-unm
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Check deploy secrets are configured
        id: check
        env:
          KEY: ${{ secrets.CARC_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.CARC_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.CARC_DEPLOY_HOST }}
          USER: ${{ secrets.CARC_DEPLOY_USER }}
          DOCROOT: ${{ secrets.CARC_DOCROOT }}
        run: |
          if [ -z "$KEY" ] && [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNM deploy secrets not set; skipping publish to carc.unm.edu"
            exit 0
          fi
          missing=
          for v in KEY KNOWN_HOSTS HOST USER DOCROOT; do
            [ -n "$(eval echo \"\$$v\")" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::UNM deploy partially configured; missing:$missing"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Publish over rsync/SSH
        if: steps.check.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.CARC_DEPLOY_KEY }}
          HOST: ${{ secrets.CARC_DEPLOY_HOST }}
          USER: ${{ secrets.CARC_DEPLOY_USER }}
          DOCROOT: ${{ secrets.CARC_DOCROOT }}
          # Pinned host key. Capture once with `ssh-keyscan -H <host>` from a
          # trusted network and store the output as this secret. Running
          # ssh-keyscan here instead would trust whatever answers at deploy
          # time, which cancels out StrictHostKeyChecking entirely.
          KNOWN_HOSTS: ${{ secrets.CARC_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # --chmod is not optional: with --no-perms, new files otherwise
          # inherit the session umask, and a restrictive one makes Apache 403
          # the whole site.
          rsync -avz --checksum --no-perms --no-owner --no-group \
                --chmod=D755,F644 \
                -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
                site/ "$USER@$HOST:$DOCROOT/"
