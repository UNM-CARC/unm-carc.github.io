# The .htaccess that Cascade published to carc.unm.edu before this repository
# took over (asset 69500253c0a8508c6f5fe53ae307e5c1, last edited by nssabol,
# published 2026-08-25). Kept verbatim for the record — it is NOT emitted.
#
# Every rule targets https://www.carc.unm.edu/, a host that no longer answers,
# so all four already fail today. /getting-started/ has a real successor and is
# ported in migration/redirects-extra.yml; the other three are dropped
# deliberately rather than carried forward as broken redirects.

# Redirect specific URLs back to old CARC server

RedirectMatch "^/irs/(.*)" "https://www.carc.unm.edu/irs/$1"
RedirectMatch "^/getting-started/(.*)" "https://www.carc.unm.edu/getting-started/$1"
RedirectMatch "^/common/(.*)" "https://www.carc.unm.edu/common/$1"
Redirect "/images/help-desk2.jpg" "https://www.carc.unm.edu/images/help-desk2.jpg"
