# Legacy carc.unm.edu binaries -> localized files in docs/assets/
#
# Hand-curated: the machine cannot infer "easley-cluster-announcement.png" from
# "untitled-design-11.png". Names are descriptive kebab-case; `alt` replaces the
# alt text where the original merely repeated the filename.
#
# Applied by scripts/migrate_assets.py, which fetches, optimizes, writes into
# docs/assets/, and rewrites every reference in docs/**/*.md.
#
# `review` marks a file a human must clear before it ships — see the licensing
# note on the stock photograph below.

